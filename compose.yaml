services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: ./backend/.env
    environment:
      PORT: "8000"
      CHROMA_PATH: /app/data/chroma
      SQLITE_PATH: /app/data/metadata.sqlite3
      EVALUATION_PATH: /app/data/evaluations/latest.json
      EVALUATION_HISTORY_PATH: /app/data/evaluations/runs
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      LOG_QUERY_TEXT: "false"
      CITERAG_ACCESS_MODE: ${CITERAG_ACCESS_MODE:-showcase}
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["citerag-data:/app/data"]
    restart: unless-stopped
    init: true
    security_opt: ["no-new-privileges:true"]
  frontend:
    build: ./frontend
    environment:
      CITERAG_BACKEND_URL: http://backend:8000
      CITERAG_FRONTEND_ORIGIN: ${CITERAG_FRONTEND_ORIGIN:-http://localhost:3000}
      # Loopback-only Compose. Remove this override for HTTPS deployments.
      CITERAG_LOCAL_HTTP: "true"
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    init: true
    security_opt: ["no-new-privileges:true"]
volumes:
  citerag-data:
